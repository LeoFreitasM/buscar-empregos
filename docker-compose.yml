services:

  mysql:
    image: mysql:8.0
    container_name: search-for-jobs-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456789
      MYSQL_DATABASE: search_jobs
    ports:
      - "3307:3306"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p123456789" ]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: search-for-jobs-app
    ports:
      - "8080:8080"
    environment:
      MYSQL_DB_URL: jdbc:mysql://mysql:3306/search_jobs
      MYSQL_DB_USERNAME: root
      MYSQL_DB_PASSWORD: 123456789
    depends_on:
      mysql:
        condition: service_healthy

